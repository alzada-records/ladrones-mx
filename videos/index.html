<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos | Ladrones</title>
  <meta name="description" content="Videos oficiales de Ladrones.">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:title" content="Videos | Ladrones">
  <meta property="og:image" content="/img/compartir.jpg">
  <meta property="og:url" content="https://www.ladrones.mx/videos/">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/main.js" defer></script>
  <script src="/js/newsletter.js" defer></script>
  <script src="/js/videos.js" defer></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="encabezado">
    <div class="contenedor">
      <a class="logo" href="/"><img src="/img/logo.webp" alt="Ladrones" width="138" height="40"></a>
      <nav aria-label="Principal">
        <button class="menu-boton" type="button" aria-expanded="false" aria-controls="menu">Menú</button>
        <ul class="menu" id="menu">
          <li><a href="/">Inicio</a></li>
          <li><a href="/tour/">Tour</a></li>
          <li><a href="/lanzamientos/">Música</a></li>
          <li><a href="/videos/" aria-current="page">Videos</a></li>
          <li><a href="/bio/">Bio</a></li>
          <li><a href="/contacto/">Contacto</a></li>
          <li><a href="https://negropasion.com/collections/ladrones" target="_blank" rel="noopener">Merch</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion">
      <div class="contenedor">
        <h1>Videos</h1>
        <!-- El catálogo se arma solo con js/videos.js (YouTube Data API).
             Mientras no haya clave, este reproductor muestra la lista de subidas del canal. -->
        <iframe class="video" id="reproductor"
          src="https://www.youtube.com/embed/videoseries?list=UUOFdvkFfaGgpkP9DawxAvZw"
          title="Videos de Ladrones"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
        <p class="video-actual" id="video-actual" aria-live="polite"></p>
      </div>
    </section>

    <section class="seccion" aria-labelledby="titulo-catalogo">
      <div class="contenedor">
        <h2 id="titulo-catalogo">Todos los videos <span class="catalogo-estado" id="catalogo-estado">Cargando…</span></h2>
        <ul class="videos" id="catalogo"></ul>
        <p><a class="boton boton-secundario" href="https://www.youtube.com/@ladronesmx" target="_blank" rel="noopener">Ver el canal en YouTube</a></p>
      </div>
    </section>

    <!-- Newsletter: Mailchimp -->
    <section class="seccion newsletter newsletter-foto newsletter-videos" aria-labelledby="titulo-newsletter">
      <div class="contenedor">
        <div class="newsletter-caja">
        <h2 id="titulo-newsletter">Únete a la lista</h2>
        <p class="seccion-intro">Fechas, lanzamientos y noticias antes que nadie.</p>
        <!-- Formulario de Mailchimp (audiencia de Alzada, us19). js/newsletter.js lo envía sin salir de la página. -->
        <form class="form-lista" action="https://alzada.us19.list-manage.com/subscribe/post?u=32d94c0e4051438d818e68013&amp;id=4bd0645e6c&amp;f_id=00b59be3f0" method="post" target="_blank" novalidate>
          <div>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="FNAME" autocomplete="given-name" required>
          </div>
          <div>
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="EMAIL" autocomplete="email" spellcheck="false" required>
          </div>
          <div class="casilla">
            <input type="checkbox" id="acepto" name="acepto" required>
            <label for="acepto">Quiero recibir noticias de Ladrones.</label>
          </div>
          <!-- Campo trampa contra bots: debe quedar vacío y oculto. -->
          <div class="trampa" aria-hidden="true"><input type="text" name="b_32d94c0e4051438d818e68013_4bd0645e6c" tabindex="-1" value="" autocomplete="off"></div>
          <button class="boton" type="submit">Suscribirme</button>
          <p class="form-mensaje" role="status" aria-live="polite"></p>
        </form>
        </div>
      </div>
    </section>

  </main>

  <footer class="pie">
    <div class="contenedor">
      <p>Sigue la L</p>

        <li><a href="https://www.tiktok.com/@ladronesmx" target="_blank" rel="noopener"><img src="/img/redes/tiktok.png" alt="TikTok" width="28" height="28" loading="lazy"></a></li>
        <li><a href="https://www.youtube.com/@ladronesmx" target="_blank" rel="noopener"><img src="/img/redes/youtube.png" alt="YouTube" width="28" height="28" loading="lazy"></a></li>
        <li><a href="https://www.facebook.com/ladronesmx" target="_blank" rel="noopener"><img src="/img/redes/facebook.png" alt="Facebook" width="28" height="28" loading="lazy"></a></li>
        <li><a href="https://open.spotify.com/artist/5KGNQQzk32VSQv9If4X7A6" target="_blank" rel="noopener"><img src="/img/redes/spotify.png" alt="Spotify" width="28" height="28" loading="lazy"></a></li>
        <li><a href="https://music.apple.com/mx/artist/ladrones/1617367440" target="_blank" rel="noopener"><img src="/img/redes/apple-music.png" alt="Apple Music" width="28" height="28" loading="lazy"></a></li>
      </ul>
      <p>© 2027 <a href="https://www.alzada.mx" target="_blank" rel="noopener">Alzada Corp</a> &amp; <a href="https://riserecords.com/" target="_blank" rel="noopener">Rise Records</a></p>
    </div>
  </footer>
</body>
</html>
